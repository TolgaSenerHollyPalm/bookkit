<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>BookKit — Kitap ekle</title>
</head>
<body>
<x-dc>
<helmet>
<!-- Fontlar: Bricolage Grotesque + Figtree -->
<style>
body{margin:0;background:#F7F5F0}
a{color:#7E2F50}a:hover{color:#9B3D63}
input::placeholder{color:#707673}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F7F5F0; color: #1B1F1E; font-family: 'Figtree', system-ui, sans-serif">

<header style="padding: 12px 20px 0; height: 60px; box-sizing: border-box; display: flex; align-items: center">
<a href="01-kitaplik.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #E8E2D7; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="#1B1F1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
</header>

<h1 style="margin: 14px 20px 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; line-height: 1.05; letter-spacing: -0.035em; font-weight: 800">Kitap ekle</h1>

<form role="search" style="margin: 16px 20px 0; display: flex; flex-direction: column; gap: 8px">
<div style="height: 52px; box-sizing: border-box; padding: 0 4px 0 14px; background: #FFFFFF; border: 1px solid #948C80; border-radius: 16px; display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#5E6562" stroke-width="2"></circle><path d="M15.5 15.5L20 20" fill="none" stroke="#5E6562" stroke-width="2" stroke-linecap="round"></path></svg>
<label for="book-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Ara</label>
<input id="book-search" type="search" value="tanpınar" placeholder="Kitap adı, yazar ya da ISBN" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; background: transparent; font: inherit; font-size: 16px; color: #1B1F1E; outline: none">
<button type="button" aria-label="Aramayı temizle" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><span style="width: 22px; height: 22px; border-radius: 999px; background: #EFEAE0; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="#4A504D" stroke-width="3" stroke-linecap="round"></path></svg></span></button>
</div>
<p style="margin: 0 4px; font-size: 13px; line-height: 1.45; color: #5E6562; text-wrap: pretty">Sonuçlar internetten geliyor; kapak ve bilgiler cihazına kaydedilir.</p>
</form>

<fieldset style="margin: 18px 20px 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Sonuçlar</legend>

<label style="padding: 10px 14px 10px 10px; border-radius: 16px; border: 1px solid #E8E2D7; background: #FFFFFF; display: flex; align-items: center; gap: 14px; cursor: pointer">
<span aria-hidden="true" style="position: relative; width: 40px; height: 60px; box-sizing: border-box; flex-shrink: 0; padding: 6px 4px 5px 7px; border-radius: 4px; background: #8C5E1C; color: #FFF4E6; display: flex; flex-direction: column; justify-content: flex-start; box-shadow: 0 6px 10px -8px rgba(27, 31, 30, 0.55)"><span style="position: absolute; left: 3px; top: 0; bottom: 0; width: 1px; background: rgba(255, 244, 230, 0.22)"></span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 6.5px; line-height: 1.05; font-weight: 700">Saatleri Ayarlama Enstitüsü</span></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600; line-height: 1.3">Saatleri Ayarlama Enstitüsü</span><span style="font-size: 13px; color: #5E6562">Ahmet Hamdi Tanpınar</span></span>
<input type="radio" name="book-result" style="margin: 0; width: 22px; height: 22px; accent-color: #9B3D63; flex-shrink: 0">
</label>

<label style="padding: 9px 13px 9px 9px; border-radius: 16px; border: 2px solid #9B3D63; background: #F6E6EC; display: flex; align-items: center; gap: 14px; cursor: pointer">
<span aria-hidden="true" style="position: relative; width: 40px; height: 60px; box-sizing: border-box; flex-shrink: 0; padding: 6px 4px 5px 7px; border-radius: 4px; background: #3E5C76; color: #FFF4E6; display: flex; flex-direction: column; justify-content: flex-start; box-shadow: 0 6px 10px -8px rgba(27, 31, 30, 0.55)"><span style="position: absolute; left: 3px; top: 0; bottom: 0; width: 1px; background: rgba(255, 244, 230, 0.22)"></span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 6.5px; line-height: 1.05; font-weight: 700">Huzur</span></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700; line-height: 1.3">Huzur</span><span style="font-size: 13px; color: #5E6562">Ahmet Hamdi Tanpınar</span></span>
<input type="radio" name="book-result" checked="" style="margin: 0; width: 22px; height: 22px; accent-color: #9B3D63; flex-shrink: 0">
</label>

<label style="padding: 10px 14px 10px 10px; border-radius: 16px; border: 1px solid #E8E2D7; background: #FFFFFF; display: flex; align-items: center; gap: 14px; cursor: pointer">
<span aria-hidden="true" style="position: relative; width: 40px; height: 60px; box-sizing: border-box; flex-shrink: 0; padding: 6px 4px 5px 7px; border-radius: 4px; background: #A0522D; color: #FFF4E6; display: flex; flex-direction: column; justify-content: flex-start; box-shadow: 0 6px 10px -8px rgba(27, 31, 30, 0.55)"><span style="position: absolute; left: 3px; top: 0; bottom: 0; width: 1px; background: rgba(255, 244, 230, 0.22)"></span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 6.5px; line-height: 1.05; font-weight: 700">Beş Şehir</span></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600; line-height: 1.3">Beş Şehir</span><span style="font-size: 13px; color: #5E6562">Ahmet Hamdi Tanpınar</span></span>
<input type="radio" name="book-result" style="margin: 0; width: 22px; height: 22px; accent-color: #9B3D63; flex-shrink: 0">
</label>
</fieldset>

<fieldset style="margin: 24px 20px 0; padding: 0; border: 0; display: flex; gap: 8px">
<legend style="padding: 0; margin-bottom: 10px; font-size: 14px; font-weight: 700">Nereye eklensin?</legend>
<label style="position: relative; flex: 1 1 auto; height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 999px; border: 2px solid #9B3D63; background: #F6E6EC; color: #7E2F50; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; white-space: nowrap; cursor: pointer"><input type="radio" name="shelf" checked="" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Okumak istiyorum</label>
<label style="position: relative; flex: 1 1 auto; height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 999px; border: 1px solid #E8E2D7; background: #FFFFFF; color: #1B1F1E; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; white-space: nowrap; cursor: pointer"><input type="radio" name="shelf" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Okuyorum</label>
<label style="position: relative; flex: 1 1 auto; height: 44px; padding: 0 12px; box-sizing: border-box; border-radius: 999px; border: 1px solid #E8E2D7; background: #FFFFFF; color: #1B1F1E; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; white-space: nowrap; cursor: pointer"><input type="radio" name="shelf" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">Okudum</label>
</fieldset>

<p style="margin: 16px 20px 0; display: flex; align-items: center; gap: 6px; font-size: 15px; color: #5E6562">Bulamadın mı?<a href="#" style="min-height: 44px; display: inline-flex; align-items: center; font-weight: 700; text-decoration: none">Elle ekle</a></p>

<button style="position: absolute; left: 20px; right: 20px; bottom: 28px; height: 54px; border-radius: 999px; border: 0; background: #9B3D63; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 12px 24px -12px rgba(126, 47, 80, 0.6); cursor: pointer">Kitaplığa ekle</button>

</div>
</x-dc>
</body>
</html>
